<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MORPHEUS VIII | School Login</title>

    <link rel="stylesheet"
          href="css/styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <img src="../assets/logo-white.png"
             class="login-logo">

        <h1>
    MORPHEUS
    <span>VIII</span>
</h1>

        <p class="subtitle">
            School Registration Portal
        </p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

           <div class="password-field">

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
    required
  >

  <button
    type="button"
    class="password-toggle"
    id="passwordToggle"
    aria-label="Show password"
  >

    <svg
      class="password-eye password-eye-show"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
      />
      <circle cx="12" cy="12" r="2.5" />
    </svg>

    <svg
      class="password-eye password-eye-hide"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M3 3l18 18"
      />
      <path
        d="M10.6 6.2A9.7 9.7 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3 3.7"
      />
      <path
        d="M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a9.7 9.7 0 0 0 3.3-.6"
      />
      <path
        d="M9.9 9.9a3 3 0 0 0 4.2 4.2"
      />
    </svg>

  </button>

</div>

           <button
    type="submit"
    class="primary-btn">

    Login

</button>

        </form> 

        <p id="loginError"
           class="login-error"></p>

        <div class="login-links">

  <a href="admin-login.html"
     class="admin-link">
    Admin Login →
  </a>

  <a href="../index.html"
     class="back-to-site">
    ← Back to Main Website
  </a>

</div>

    </div>

</div>


<script type="module" src="js/auth.js"></script>

</body>
</html>
